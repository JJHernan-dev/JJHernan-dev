<svg width="280" height="70" viewBox="0 0 280 70" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C74B3"/>
      <stop offset="100%" stop-color="#123C6B"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="btnClip2">
      <rect x="0" y="0" width="272" height="60" rx="16"/>
    </clipPath>
    <style>
      .mono{font-family:'Consolas','SFMono-Regular',monospace;}
      .btnGroup{cursor:pointer;}
      .btnGroup:hover .btnLift{transform:translateY(-2px);}
      .btnLift{transition:transform 0.2s ease;}
    </style>
  </defs>

  <a href="https://www.linkedin.com/in/juanjesus-gh/" xlink:href="https://www.linkedin.com/in/juanjesus-gh/" target="_blank" rel="noopener">
    <g class="btnGroup" transform="translate(4,2)">

      <!-- sombra / base del boton (efecto relieve) -->
      <rect x="0" y="6" width="272" height="60" rx="16" fill="#050D1A"/>

      <!-- cuerpo del boton, capa elevada -->
      <g class="btnLift">
        <rect x="0" y="0" width="272" height="60" rx="16" fill="url(#btnGrad)"/>

        <g clip-path="url(#btnClip2)">
          <!-- panel izquierdo, tono mas oscuro -->
          <rect x="0" y="0" width="72" height="60" fill="#0A2540"/>
          <line x1="72" y1="0" x2="72" y2="60" stroke="#4FC3F7" stroke-opacity="0.3" stroke-width="1"/>

          <!-- resplandor suave tras el icono (animacion del panel) -->
          <circle cx="36" cy="30" r="32" fill="url(#iconGlow)" opacity="0.3">
            <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
          </circle>
        </g>

        <!-- borde -->
        <rect x="0.75" y="0.75" width="270.5" height="58.5" rx="15.3" fill="none" stroke="#4FC3F7" stroke-width="1.2" stroke-opacity="0.4"/>

        <!-- icono / monograma -->
        <g transform="translate(36,30)">
          <circle cx="0" cy="0" r="14" fill="none" stroke="#90CAF9" stroke-width="1.4" stroke-opacity="0.5"/>
          <text x="0" y="6" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#90CAF9">in</text>
        </g>

        <!-- texto -->
        <text x="96" y="30" class="mono" font-size="16" font-weight="700" fill="#E6F1FF">Ver LinkedIn</text>
        <text x="96" y="47" class="mono" font-size="11" fill="#BFE3FF" fill-opacity="0.75">/in/juanjesus-gh/</text>

        <!-- flecha animada -->
        <g transform="translate(246,30)">
          <animateTransform attributeName="transform" type="translate" values="246,30;252,30;246,30" dur="1.6s" repeatCount="indefinite" additive="sum"/>
          <path d="M0 -6 L8 0 L0 6" fill="none" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </a>
</svg>
