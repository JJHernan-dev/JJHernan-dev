<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020C1B"/>
      <stop offset="45%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#123C6B"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;60%;0%" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2C74B3"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFF3FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#DFF3FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#DFF3FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4FC3F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 H0 V42" fill="none" stroke="#4FC3F7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="0" y="0" height="70" width="0">
        <animate attributeName="width" from="0" to="430" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </clipPath>
    <style>
      .mono{font-family:'Consolas','SFMono-Regular',monospace;}
      .nodeText{font-family:'Consolas','SFMono-Regular',monospace;font-size:15px;fill:#E6F1FF;text-anchor:middle;}
      .cursor{animation:blink 1s steps(1) infinite;}
      @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- haz de luz que recorre el banner -->
  <g opacity="1">
    <rect x="-260" y="-60" width="220" height="420" fill="url(#sweepGrad)" transform="rotate(18 0 0)">
      <animateTransform attributeName="transform" type="translate" values="-260,0;1500,0" dur="9s" begin="0s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- marco: barra superior tipo terminal -->
  <rect x="0" y="0" width="1200" height="32" fill="#08182C"/>
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.7"/>
  <circle cx="20" cy="16" r="5" fill="#4FC3F7" fill-opacity="0.85"/>
  <circle cx="38" cy="16" r="5" fill="#4FC3F7" fill-opacity="0.55"/>
  <circle cx="56" cy="16" r="5" fill="#4FC3F7" fill-opacity="0.3"/>
  <text x="600" y="20" text-anchor="middle" class="mono" font-size="12" fill="#4FC3F7" fill-opacity="0.55">juanjesus@dev:~$ whoami</text>

  <!-- esquinas tipo visor -->
  <g stroke="#4FC3F7" stroke-width="1.4" stroke-opacity="0.5" fill="none">
    <animate attributeName="stroke-opacity" values="0.25;0.55;0.25" dur="5s" repeatCount="indefinite"/>
    <path d="M14 46 V64 M14 46 H32"/>
    <path d="M1186 46 V64 M1186 46 H1168"/>
    <path d="M14 286 V268 M14 286 H32"/>
    <path d="M1186 286 V268 M1186 286 H1168"/>
  </g>

  <!-- puntos tipo circuito, pulsando -->
  <g fill="#4FC3F7">
    <circle cx="130" cy="55" r="1.8"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="80" r="1.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="120" r="1.4"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="240" r="1.5"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="3.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="90" r="1.4"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.6s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- nombre con efecto de escritura -->
  <g clip-path="url(#typeClip)" transform="translate(60,80)">
    <text x="0" y="55" font-size="52" font-weight="700" fill="#E6F1FF">Juan Jesús</text>
  </g>
  <rect class="cursor" x="493" y="98" width="4" height="46" fill="#4FC3F7">
    <animate attributeName="opacity" values="0;0;1" dur="0.2s" begin="1.6s" fill="freeze"/>
  </rect>

  <!-- subtítulo -->
  <text class="mono" x="61" y="170" font-size="19" fill="#90CAF9" opacity="0">
    Desarrollo · QA Automation · Ciberseguridad
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.9s" fill="freeze"/>
  </text>
  <text class="mono" x="61" y="196" font-size="13" fill="#4FC3F7" opacity="0">
    github.com/JJHernan-dev
    <animate attributeName="opacity" from="0" to="0.85" dur="0.8s" begin="2.3s" fill="freeze"/>
  </text>
  <rect x="61" y="205" width="0" height="2" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="230" dur="0.7s" begin="2.5s" fill="freeze"/>
  </rect>

  <!-- ===== constelación tecnológica (lado derecho) ===== -->

  <!-- lineas de conexion -->
  <g stroke="#4FC3F7" stroke-opacity="0.3" stroke-width="1.3">
    <line x1="930" y1="150" x2="815" y2="55"/>
    <line x1="930" y1="150" x2="1060" y2="55"/>
    <line x1="930" y1="150" x2="1115" y2="150"/>
    <line x1="930" y1="150" x2="1060" y2="245"/>
    <line x1="930" y1="150" x2="815" y2="245"/>
  </g>

  <!-- pulsos viajando por las lineas, con estela -->
  <circle r="3" fill="#90CAF9"><animateMotion path="M930 150 L815 55" dur="2.6s" begin="3.2s" repeatCount="indefinite"/></circle>
  <circle r="1.8" fill="#90CAF9" opacity="0.5"><animateMotion path="M930 150 L815 55" dur="2.6s" begin="3.35s" repeatCount="indefinite"/></circle>

  <circle r="3" fill="#90CAF9"><animateMotion path="M930 150 L1060 55" dur="3.1s" begin="3.5s" repeatCount="indefinite"/></circle>
  <circle r="1.8" fill="#90CAF9" opacity="0.5"><animateMotion path="M930 150 L1060 55" dur="3.1s" begin="3.65s" repeatCount="indefinite"/></circle>

  <circle r="3" fill="#90CAF9"><animateMotion path="M930 150 L1115 150" dur="2.3s" begin="3.8s" repeatCount="indefinite"/></circle>
  <circle r="1.8" fill="#90CAF9" opacity="0.5"><animateMotion path="M930 150 L1115 150" dur="2.3s" begin="3.95s" repeatCount="indefinite"/></circle>

  <circle r="3" fill="#90CAF9"><animateMotion path="M930 150 L1060 245" dur="3.4s" begin="4.1s" repeatCount="indefinite"/></circle>
  <circle r="1.8" fill="#90CAF9" opacity="0.5"><animateMotion path="M930 150 L1060 245" dur="3.4s" begin="4.25s" repeatCount="indefinite"/></circle>

  <circle r="3" fill="#90CAF9"><animateMotion path="M930 150 L815 245" dur="2.8s" begin="4.4s" repeatCount="indefinite"/></circle>
  <circle r="1.8" fill="#90CAF9" opacity="0.5"><animateMotion path="M930 150 L815 245" dur="2.8s" begin="4.55s" repeatCount="indefinite"/></circle>

  <!-- nodo central -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.6s" fill="freeze"/>
    <circle cx="930" cy="150" r="70" fill="none" stroke="#4FC3F7" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="360 930 150" to="0 930 150" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="150" r="58" fill="none" stroke="#4FC3F7" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 7">
      <animateTransform attributeName="transform" type="rotate" from="0 930 150" to="360 930 150" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="150" r="40" fill="url(#hubGrad)" stroke="#4FC3F7" stroke-width="1.4">
      <animate attributeName="r" values="40;42;40" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text x="930" y="157" font-size="20" font-weight="700" fill="#E6F1FF" text-anchor="middle" class="mono">&lt;/&gt;</text>
  </g>

  <!-- Java -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.0s" fill="freeze"/>
    <g transform="translate(815,55)">
      <animateTransform attributeName="transform" type="translate" values="815,55;815,47;815,55" dur="3.6s" begin="3.0s" repeatCount="indefinite" additive="sum"/>
      <rect x="-55" y="-19" width="110" height="38" rx="19" fill="#123C6B" stroke="#2C74B3" stroke-width="1"/>
      <text class="nodeText" x="0" y="5">Java</text>
    </g>
  </g>

  <!-- Spring Boot -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.15s" fill="freeze"/>
    <g transform="translate(1060,55)">
      <animateTransform attributeName="transform" type="translate" values="1060,55;1060,47;1060,55" dur="3.2s" begin="3.15s" repeatCount="indefinite" additive="sum"/>
      <rect x="-80" y="-19" width="160" height="38" rx="19" fill="#0D2E4E" stroke="#1E5A8C" stroke-width="1"/>
      <text class="nodeText" x="0" y="5">Spring Boot</text>
    </g>
  </g>

  <!-- Playwright -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.3s" fill="freeze"/>
    <g transform="translate(1115,150)">
      <animateTransform attributeName="transform" type="translate" values="1115,150;1115,142;1115,150" dur="3.8s" begin="3.3s" repeatCount="indefinite" additive="sum"/>
      <rect x="-70" y="-19" width="140" height="38" rx="19" fill="#123C6B" stroke="#2C74B3" stroke-width="1"/>
      <text class="nodeText" x="0" y="5">Playwright</text>
    </g>
  </g>

  <!-- C# -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.45s" fill="freeze"/>
    <g transform="translate(1060,245)">
      <animateTransform attributeName="transform" type="translate" values="1060,245;1060,237;1060,245" dur="3.3s" begin="3.45s" repeatCount="indefinite" additive="sum"/>
      <rect x="-45" y="-19" width="90" height="38" rx="19" fill="#0D2E4E" stroke="#1E5A8C" stroke-width="1"/>
      <text class="nodeText" x="0" y="5" font-weight="700">C#</text>
    </g>
  </g>

  <!-- GitHub -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.6s" fill="freeze"/>
    <g transform="translate(815,245)">
      <animateTransform attributeName="transform" type="translate" values="815,245;815,237;815,245" dur="3.5s" begin="3.6s" repeatCount="indefinite" additive="sum"/>
      <rect x="-58" y="-19" width="116" height="38" rx="19" fill="#123C6B" stroke="#2C74B3" stroke-width="1"/>
      <text class="nodeText" x="0" y="5">GitHub</text>
    </g>
  </g>

  <!-- barra inferior animada -->
  <rect x="0" y="297" width="1200" height="2" fill="#08182C"/>
  <rect x="0" y="297" width="220" height="2" fill="url(#barGrad)">
    <animateTransform attributeName="transform" type="translate" values="-220,0;1420,0" dur="6s" begin="0s" repeatCount="indefinite"/>
  </rect>
</svg>
