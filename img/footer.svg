<svg width="1200" height="56" viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020C1B"/>
      <stop offset="50%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#123C6B"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4FC3F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 H0 V42" fill="none" stroke="#4FC3F7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:'Consolas','SFMono-Regular',monospace;}
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="56" fill="url(#bgGrad)"/>
  <rect width="1200" height="56" fill="url(#grid)"/>

  <!-- linea superior fija -->
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.8"/>

  <!-- luz que recorre la linea superior -->
  <rect x="0" y="0" width="240" height="2" fill="url(#barGrad)">
    <animateTransform attributeName="transform" type="translate" values="-240,0;1440,0" dur="7s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- puntos decorativos -->
  <g fill="#4FC3F7">
    <circle cx="90" cy="28" r="1.6"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="28" r="1.6"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- texto -->
  <text x="600" y="33" text-anchor="middle" class="mono" font-size="15" fill="#90CAF9" opacity="0">
    Juan Jesús González Hernández <tspan fill="#4FC3F7">·</tspan> github.com/JJHernan-dev
    <animate attributeName="opacity" from="0" to="0.95" dur="1s" begin="0.3s" fill="freeze"/>
  </text>
</svg>
