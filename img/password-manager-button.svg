<svg width="320" height="70" viewBox="0 0 320 70" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="btnGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4B72"/>
      <stop offset="100%" stop-color="#0A2A45"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FD4F0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5FD4F0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="btnClip3">
      <rect x="0" y="0" width="312" height="60"/>
    </clipPath>
    <style>
      .mono{font-family:'Consolas','SFMono-Regular',monospace;}
    </style>
  </defs>

  <g transform="translate(4,2)">
    <rect x="0" y="6" width="312" height="60" fill="#040D16"/>
    <rect x="0" y="0" width="312" height="60" fill="url(#btnGrad3)"/>

    <g clip-path="url(#btnClip3)">
      <rect x="0" y="0" width="78" height="60" fill="#06141F"/>
      <circle cx="39" cy="30" r="34" fill="url(#iconGlow)" opacity="0.3">
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </circle>
      <line x1="78" y1="0" x2="78" y2="60" stroke="#5FD4F0" stroke-opacity="0.3" stroke-width="1"/>
    </g>

    <rect x="0.75" y="0.75" width="310.5" height="58.5" fill="none" stroke="#5FD4F0" stroke-width="1.2" stroke-opacity="0.35"/>

    <g transform="translate(39,30)">
      <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="#5FD4F0" stroke-width="1.2" stroke-opacity="0.4">
        <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </rect>
      <text x="0" y="7" text-anchor="middle" class="mono" font-size="19" font-weight="700" fill="#5FD4F0">C#</text>
    </g>

    <text x="100" y="36" class="mono" font-size="16" font-weight="700" fill="#E6F1FF">Password Manager</text>
  </g>
</svg>
